name: Telegram Deal Bot

on:
  schedule:
    # Runs every hour at :00 UTC
    # USA  window  8AM–1AM EST  = 13:00–06:00 UTC  (UTC-5 standard)
    # IN   window  8AM–1AM IST  = 02:30–19:30 UTC  (UTC+5:30)
    # Running every hour covers both windows — script skips if outside window
    - cron: "0 * * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  post-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal bot
        env:
          TELEGRAM_BOT_TOKEN:              ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_US:             ${{ secrets.TELEGRAM_CHANNEL_US }}
          TELEGRAM_CHANNEL_IN:             ${{ secrets.TELEGRAM_CHANNEL_IN }}
          SUPABASE_URL:                    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                    ${{ secrets.SUPABASE_KEY }}
          AMAZON_CREATORS_CLIENT_ID_US:    ${{ secrets.AMAZON_CREATORS_CLIENT_ID_US }}
          AMAZON_CREATORS_CLIENT_SECRET_US: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET_US }}
          AMAZON_CREATORS_PARTNER_TAG_US:  ${{ secrets.AMAZON_CREATORS_PARTNER_TAG_US }}
          AMAZON_MARKETPLACE_US:           ${{ secrets.AMAZON_MARKETPLACE_US }}
          AMAZON_CREATORS_CLIENT_ID_IN:    ${{ secrets.AMAZON_CREATORS_CLIENT_ID_IN }}
          AMAZON_CREATORS_CLIENT_SECRET_IN: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET_IN }}
          AMAZON_CREATORS_PARTNER_TAG_IN:  ${{ secrets.AMAZON_CREATORS_PARTNER_TAG_IN }}
          AMAZON_MARKETPLACE_IN:           ${{ secrets.AMAZON_MARKETPLACE_IN }}
          RAPIDAPI_KEY:                    ${{ secrets.RAPIDAPI_KEY }}
          AMAZON_FALLBACK_ENABLED:         "true"
        run: python run_bot.py
