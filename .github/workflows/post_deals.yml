name: Telegram Deal Bot

on:
  # DISABLED — cron-job.org drives this now, via the repository_dispatch
  # trigger below (hourly). Keep that job HOURLY: run_bot.py applies its own
  # per-region window (8 AM–1 AM local for both US and India) and runs the
  # midnight queue flush, so a sparser schedule breaks both.
  # Re-enabling this alongside the cron-job.org job posts everything twice.
  #
  # schedule:
  #   - cron: "0 * * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

  # External trigger for cron-job.org. POST to
  #   https://api.github.com/repos/<owner>/<repo>/dispatches
  # with {"event_type":"trigger-telegram-post"}
  repository_dispatch:
    types: [trigger-telegram-post]

jobs:
  post-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal bot
        env:
          TELEGRAM_BOT_TOKEN:              ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_US:             ${{ secrets.TELEGRAM_CHANNEL_US }}
          TELEGRAM_CHANNEL_IN:             ${{ secrets.TELEGRAM_CHANNEL_IN }}
          SUPABASE_URL:                    ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                    ${{ secrets.SUPABASE_KEY }}
          AMAZON_CREATORS_CLIENT_ID_US:    ${{ secrets.AMAZON_CREATORS_CLIENT_ID_US }}
          AMAZON_CREATORS_CLIENT_SECRET_US: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET_US }}
          AMAZON_CREATORS_PARTNER_TAG_US:  ${{ secrets.AMAZON_CREATORS_PARTNER_TAG_US }}
          AMAZON_MARKETPLACE_US:           ${{ secrets.AMAZON_MARKETPLACE_US }}
          AMAZON_CREATORS_CLIENT_ID_IN:    ${{ secrets.AMAZON_CREATORS_CLIENT_ID_IN }}
          AMAZON_CREATORS_CLIENT_SECRET_IN: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET_IN }}
          AMAZON_CREATORS_PARTNER_TAG_IN:  ${{ secrets.AMAZON_CREATORS_PARTNER_TAG_IN }}
          AMAZON_MARKETPLACE_IN:           ${{ secrets.AMAZON_MARKETPLACE_IN }}
          RAPIDAPI_KEY:                    ${{ secrets.RAPIDAPI_KEY }}
          AMAZON_FALLBACK_ENABLED:         "true"
        run: python run_bot.py
