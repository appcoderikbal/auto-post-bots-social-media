name: Facebook + Instagram Deal Bot

on:
  schedule:
    # Posts 4x a day on US Eastern: 9 AM, 1 PM, 5 PM, 8 PM ET.
    # GitHub cron is UTC and ignores DST, so we fire on every UTC hour that
    # could map to a slot under EST (UTC-5) or EDT (UTC-4); post_social.py
    # checks the real ET hour and skips the runs that aren't a slot.
    #   9 AM ET -> 13:00 / 14:00 UTC
    #   1 PM ET -> 17:00 / 18:00 UTC
    #   5 PM ET -> 21:00 / 22:00 UTC
    #   8 PM ET -> 00:00 / 01:00 UTC
    - cron: "0 0,1,13,14,17,18,21,22 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Post immediately, ignoring the ET schedule"
        type: boolean
        default: true
      dry_run:
        description: "Pick a deal and print the captions without posting"
        type: boolean
        default: false
      platform:
        description: "Which network to post to"
        type: choice
        default: all
        options: [all, fb, ig, fb_kitchen, ig_kitchen]

  # External trigger for cron-job.org. POST to
  #   https://api.github.com/repos/<owner>/<repo>/dispatches
  # with {"event_type":"trigger-social-post","client_payload":{"platform":"ig_kitchen"}}
  # platform accepts: all | fb | ig | fb_kitchen | ig_kitchen, or a
  # comma-separated subset such as "fb_kitchen,ig_kitchen".
  # Omit it to post to all four accounts.
  repository_dispatch:
    types: [trigger-social-post]

jobs:
  post-social:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post best deal to all Facebook + Instagram accounts
        env:
          FB_PAGE_ID:                       ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:             ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:             ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCOUNT_ID_KITCHEN:     ${{ secrets.INSTAGRAM_ACCOUNT_ID_KITCHEN }}
          FB_PAGE_ID_KITCHEN:               ${{ secrets.FB_PAGE_ID_KITCHEN }}
          FB_PAGE_ACCESS_TOKEN_KITCHEN:     ${{ secrets.FB_PAGE_ACCESS_TOKEN_KITCHEN }}
          FB_LOCATION_ID:                   ${{ secrets.FB_LOCATION_ID }}
          TELEGRAM_CHANNEL_US:              ${{ secrets.TELEGRAM_CHANNEL_US }}
          SUPABASE_URL:                     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:                     ${{ secrets.SUPABASE_KEY }}
          AMAZON_CREATORS_CLIENT_ID_US:     ${{ secrets.AMAZON_CREATORS_CLIENT_ID_US }}
          AMAZON_CREATORS_CLIENT_SECRET_US: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET_US }}
          AMAZON_CREATORS_PARTNER_TAG_US:   ${{ secrets.AMAZON_CREATORS_PARTNER_TAG_US }}
          AMAZON_MARKETPLACE_US:            ${{ secrets.AMAZON_MARKETPLACE_US }}
          RAPIDAPI_KEY:                     ${{ secrets.RAPIDAPI_KEY }}
          AMAZON_FALLBACK_ENABLED:          "true"
          SOCIAL_POST_HOURS:                "9,13,17,20"
          # Anything that isn't GitHub's own cron owns its own timing, so it
          # posts immediately; scheduled runs still honour the ET slot check.
          SOCIAL_FORCE:                     ${{ github.event_name != 'schedule' }}
          # From cron-job.org's client_payload, or the manual dispatch form.
          SOCIAL_DRY_RUN:                   ${{ github.event.client_payload.dry_run || inputs.dry_run }}
          SOCIAL_PLATFORM:                  ${{ github.event.client_payload.platform || inputs.platform }}
        run: python post_social.py
